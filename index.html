<!doctype html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0058f4" />
  <meta name="description" content="DaraLearn — білімге апаратын жеке жолың. Пәндер, курстар, тапсырмалар және оқу прогресі бір жерде." />
  <title>DaraLearn — Басты бет</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a href="#home" class="brand"><img src="logo.png" alt="DL" /> DaraLearn</a>
    <nav class="nav" id="nav"></nav>
    <nav class="nav nav-bottom" id="nav-bottom"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>

  <header class="header">
    <button class="burger" id="burger" aria-label="Мәзір">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Тақырыптарды, сабақтарды немесе тапсырмаларды іздеу..." />
      <span class="kbd">Ctrl K</span>
    </label>
    <div class="header-right">
      <button class="bell" aria-label="Хабарламалар" id="bell">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
      <a href="#settings" class="user">
        <div class="avatar">U</div>
        <div class="user-info">
          <div class="user-name">User</div>
          <div class="user-sub">10 сынып</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </a>
    </div>
  </header>

  <main class="main" id="app"></main>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
